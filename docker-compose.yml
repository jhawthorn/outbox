services:
  # Web UI, plus git over HTTP. Everything requires OUTBOX_PASSWORD unless
  # OUTBOX_GIT_AUTH=none, which leaves the git endpoint open for agents on
  # the network (and to anything else on it).
  outbox:
    build: .
    ports:
      - "8080:8080"
    environment:
      OUTBOX_PASSWORD: ${OUTBOX_PASSWORD:?set OUTBOX_PASSWORD in .env}
      OUTBOX_GIT_AUTH: ${OUTBOX_GIT_AUTH:-password}
    volumes:
      - outbox-repos:/data/repos
      - outbox-keys:/data/keys
      # The approved configuration. Not in repos/, so the daemon cannot
      # serve it; only approving a change to _config writes to it.
      - outbox-config:/data/config.git
    # Starts after the daemon: this container's entrypoint fixes the shared
    # volume's ownership, and podman resets it when the daemon container starts.
    depends_on:
      - outbox-git
    restart: unless-stopped

  # Git-only endpoint for agents when the HTTP one is password protected.
  # Plain git daemon with push enabled, on the agents network only, not
  # published to the host. Sees the repos and nothing else; the update hook
  # in each repo limits pushes to refs/heads/*.
  outbox-git:
    build:
      context: .
      dockerfile: Dockerfile.git
    volumes:
      - outbox-repos:/data/repos
    networks:
      - agents
    restart: unless-stopped

networks:
  # Attach agent containers here. Their remote is git://outbox-git/<name>.git.
  # Internal: no route out, so agents need a second network for the LLM API.
  agents:
    internal: true

volumes:
  outbox-repos:
  outbox-keys:
  outbox-config:
